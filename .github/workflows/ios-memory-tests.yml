name: iPadOS real memory backend
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: patchzyy/Wiicompiled
          ref: bd219e38a3e9a1a5047ce41d8cd01210bef3af43
          path: upstream
          persist-credentials: false
      - name: Build and validate real memory backend
        shell: bash
        run: bash memory/build-memory-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-memory-results
          path: |
            artifacts/logs/
            artifacts/WiiCompiledMemoryTests-unsigned.ipa
          retention-days: 7
