name: iPadOS Aurora graphics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: patchzyy/Wiicompiled
          ref: bd219e38a3e9a1a5047ce41d8cd01210bef3af43
          path: upstream
          persist-credentials: false
      - name: Configure and build physical iOS renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          cp -R graphics upstream/
          cmake -S upstream/graphics -B build-graphics -G Ninja -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release 2>&1 | tee artifacts/logs/configure.txt
          cmake --build build-graphics --target WiiCompiledGraphicsTests -j 3 2>&1 | tee artifacts/logs/build.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-graphics-results
          path: artifacts/
          retention-days: 7
