name: iPadOS Aurora graphics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify SDK
        id: sdk
        run: echo "version=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: build-graphics
          key: ios-metal-arm64-release16-dawn13abc3bc-sdl5848e584-${{ steps.sdk.outputs.version }}-${{ hashFiles('graphics/**', 'graphics-overlay/**') }}
          restore-keys: ios-metal-arm64-release16-dawn13abc3bc-sdl5848e584-${{ steps.sdk.outputs.version }}-
      - uses: actions/checkout@v4
        with:
          repository: patchzyy/Wiicompiled
          ref: bd219e38a3e9a1a5047ce41d8cd01210bef3af43
          path: upstream
          persist-credentials: false
      - name: Configure and build physical iOS renderer
        shell: bash
        run: bash graphics/build.sh
      - uses: actions/cache/save@v4
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: build-graphics
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-graphics-results
          path: artifacts/
          retention-days: 7
